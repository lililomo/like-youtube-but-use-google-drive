# Logrotate log aplikasi Dymas Video / GDrive Tube (SPEC §20).
# Pasang: cp scripts/ops/logrotate-video_dymas.conf /etc/logrotate.d/video_dymas && logrotate -d /etc/logrotate.d/video_dymas
# copytruncate: skrip start aaPanel menulis log dengan redirect (>>), jadi file tidak boleh diganti.
/www/server/nodejs/vhost/logs/video_dymas.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
}
