# === Dymas Video custom config (sumber: scripts/nginx-custom.conf; dicatat di CLAUDE.md) ===
# Dipasang ke /www/server/panel/vhost/rewrite/node_video_dymas.conf (di-include di dalam blok server).
client_max_body_size 64m;

location ^~ /internal/ { return 404; }

location ^~ /assets/ {
    alias /www/wwwroot/video.dymas.cloud/web/dist/assets/;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /media/ {
    alias /www/wwwroot/video.dymas.cloud/storage/public/;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

location ^~ /stream/ {
    proxy_pass http://127.0.0.1:3210;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    gzip off;
}

location ^~ /api/uploads {
    client_max_body_size 64m;
    proxy_pass http://127.0.0.1:3210;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
